note: >-
  GRIN's REST API is self-described on its own documentation host as a first,
  read-only public version. The single most important lifecycle fact found this
  pass is that the API reference GRIN links to is BROKEN: the Stoplight
  workspace at api.grin.co renders home content whose only link is
  https://grin.stoplight.io/docs/grin-open-api-docs, and that URL returns HTTP
  404 on both grin.stoplight.io and the api.grin.co custom domain. The
  workspace record was last updated 2026-05-15. So the documented REST surface
  is currently undiscoverable while the newer agent surface (the Gia MCP server
  at mcp.grin.co) is live but undocumented — the two have swapped places with
  no deprecation notice tying them together.

