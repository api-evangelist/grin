apis:
- name: GRIN API
  description: >-
    GRIN's bi-directional REST API lets a brand's own software communicate with
    GRIN to synchronize creators, content, programs, and reporting data.
    Reference documentation is published on Stoplight at api.grin.co.
  humanURL: https://api.grin.co/
  baseURL: https://api.grin.co
  properties:
  - type: APIReference
    url: https://api.grin.co/
  - type: Documentation
    url: https://help.grin.co
  x-note: >-
    api.grin.co is a Stoplight documentation workspace, not a runtime API host.
    Its home content links https://grin.stoplight.io/docs/grin-open-api-docs,
    which returned HTTP 404 on 2026-08-13 on both the Stoplight subdomain and
    the api.grin.co custom domain, so no OpenAPI could be harvested. The
    runtime base URL is not published anywhere public and is deliberately not
    guessed. See lifecycle/grin-lifecycle.yml.
- name: GRIN Gia MCP Server
  description: >-
    GRIN's hosted remote Model Context Protocol server for Gia, its AI agent for
    creator marketing. GRIN documents that "Gia connects to Claude, ChatGPT, and
    other assistants that support MCP", and the endpoint answers live: every
    path returns HTTP 401 with an RFC 9728 challenge naming
    https://mcp.grin.co/.well-known/oauth-protected-resource, which in turn
    names the resource https://mcp.grin.co/mcp and the authorization server
    https://auth.grin.co/. The tool manifest is OAuth-gated, so tools/list could
    not be read anonymously.
  humanURL: https://grin.co/gia
  baseURL: https://mcp.grin.co/mcp
  properties:
  - type: MCPServer
    url: mcp/grin-mcp.yml
  - type: Authentication
    url: authentication/grin-authentication.yml
  - type: OAuthScopes
    url: scopes/grin-scopes.yml
  - type: Documentation
    url: https://grin.co/gia
