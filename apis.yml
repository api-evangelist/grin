aid: grin
name: Grin
description: >-
  GRIN is a creator management and influencer marketing platform for consumer
  and eCommerce brands, operating in the creator economy. Brands use GRIN to
  discover creators, manage relationships and content, run affiliate and
  ambassador programs, handle creator payments, track performance, and measure
  ROI at scale. The product line includes GRIN Classic, a manual creator and
  affiliate management platform, and Gia, an AI assistant that automates
  affiliate program management. GRIN exposes a bi-directional REST API
  (documented on Stoplight at api.grin.co) so a brand's own software can
  synchronize creators, content, and program data with GRIN, alongside native
  integrations for Shopify, Klaviyo, PayPal, Slack, and other commerce tools.
