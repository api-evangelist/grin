errors:
  envelope: >-
    The only error envelope observable on a GRIN-operated host is the MCP
    server's: {"error":"Unauthorized","message":"Missing bearer token"} returned
    with HTTP 401 and an RFC 9728 WWW-Authenticate challenge. It is a flat
    {error, message} JSON object, not RFC 9457 problem+json.
  rfc9457: false
  content_type: application/json
  documented_catalog: false
  note: >-
    No error reference is published, so no errors/ artifact was written — a
    single observed 401 shape is not a catalog.

rate_limits:
