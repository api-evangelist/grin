method: searched
source: https://api.grin.co/
note: >-
  GRIN publishes almost no cross-cutting runtime semantics. What follows is only
  what GRIN itself states on a reachable page, plus what the two live discovery
  documents and the MCP 401 response actually prove. Nothing is inferred from a
  spec, because no OpenAPI is publicly reachable (see
  lifecycle/grin-lifecycle.yml). Where a convention is not published, it is
  recorded as unknown rather than assumed — in particular there is NO published
  idempotency contract, so no Idempotency pointer is emitted for GRIN.

architecture:
  style: REST
  resource_urls: predictable, resource-oriented
  encoding: JSON
  status_codes: standard HTTP
  mutability: read-only (first public version)
  source: https://api.grin.co/ (Stoplight workspace home content)

authentication:
  style: OAuth 2.0 / OIDC bearer token (Auth0 tenant on auth.grin.co)
  header: 'Authorization: Bearer <token>'
  applies_to: https://mcp.grin.co/mcp
  challenge_standard: RFC 9728 protected-resource metadata via WWW-Authenticate
  rest_api: >-
    "uses standard HTTP response codes and authentication" is the only statement
    GRIN publishes about REST auth; the mechanism is not documented publicly.
  detail: authentication/grin-authentication.yml

idempotency:
  supported: unknown
  header: null
  scope: null
  retention: null
  note: >-
    No idempotency key, header or retry-safety contract is documented anywhere
    on GRIN's public surface. The REST API is described as read-only, which
    sidesteps the problem for reads, but the Gia MCP server performs
    consequential writes (outreach, offers, payments) and publishes no
    idempotency semantics for them. GRIN's stated control is a human approval
    gate ("No message, offer, or payment goes out without your sign-off"), which
    is a governance control, not a retry-safety contract.

