agent_governance:
  human_in_the_loop: required for messages, offers, contracts and payments
  autonomy_tiers: [Skills (on-demand), Coaches (guided), Workflows (autonomous)]
  source: https://grin.co/gia

crawler_policy:
  robots: https://grin.co/robots.txt
  content_signal: 'search=yes, ai-input=yes, ai-train=no'
  allows: [Googlebot, Bingbot, ChatGPT-User, OAI-SearchBot, GPTBot, Claude-Web, PerplexityBot]
  disallows: [Google-Extended, ClaudeBot, anthropic-ai, CCBot, Amazonbot, Bytespider, Applebot-Extended, cohere-ai]
  note: >-
    GRIN separates answer-engine retrieval from model training at the robots
    layer and says so in a comment, and emits a Content-Signal directive. This
    is a deliberate, documented agent-access posture — unusual and worth
    recording — though it governs the marketing site, not the API.

