model: >-
  Usage-based credit metering. GRIN meters the work Gia performs — not seats and
  not creator-list size. Credits cover sourcing, outreach, gifting, reporting,
  contracts and workflows; heavier work consumes more credits per action. Unused
  monthly credits do not roll over; purchased overage credits do. Billing is
  month-to-month with no contract. The paid tiers from Growth up also bundle
  GRIN Classic capacity, expressed as a ceiling on active creators.
note: >-
  GRIN publishes no API-specific plan, quota or add-on. API and MCP access are
  not named as a tier feature anywhere on the pricing page, so no per-tier API
  entitlement is recorded. The overage rate is described as "metered at a flat
  rate under a brand-set cap" but the rate itself is not published.

