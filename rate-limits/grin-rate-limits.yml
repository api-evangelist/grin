note: >-
  GRIN publishes no API rate limits. The pricing page documents a credit meter
  (200 to 30,000 credits per month by tier, with flat-rate overage under a
  brand-set cap) which bounds how much WORK Gia performs, but it is a billing
  quota, not a request-rate contract: no window, no burst, no per-key or
  per-endpoint scope, and no exhaustion status code are stated. No rate-limit
  response headers could be observed either — the Gia MCP server answers 401 to
  every anonymous request and returns no RateLimit-*, X-RateLimit-* or
  Retry-After header, and the documented REST API reference is unreachable (its
  Stoplight project 404s), so there is no public surface on which a limit could
  be read. An agent integrating GRIN cannot discover its throughput budget
  before hitting it.
